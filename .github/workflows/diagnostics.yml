name: Build diagnostic artifact
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:engine && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-app
          path: |
            standalone.html
            dist/
            docs/ui-bundle-audit.json
          retention-days: 7
      - name: Package installed development dependencies
        run: tar -czf development-dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-dependencies
          path: development-dependencies.tgz
          retention-days: 1
