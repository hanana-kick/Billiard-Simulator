name: Idle precompute retention Chrome verification (no deployment)
on:
  push:
    branches: ['backup/idle-precompute-retention-20261106']
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:engine
      - run: npm run test:next-shot && node --test tests/prestrike-controller.cjs
      - run: npm run typecheck
      - name: Build frozen baseline and candidate
        run: |
          mkdir "$RUNNER_TEMP/baseline"
          tar --exclude=.git --exclude=node_modules --exclude=dist -cf - . | tar -xf - -C "$RUNNER_TEMP/baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/baseline/node_modules"
          cp verification/idle-retention/baseline-next-shot-service.js "$RUNNER_TEMP/baseline/src/next-shot-service.js"
          node build.cjs
          (cd "$RUNNER_TEMP/baseline" && npm run prepare:engine && node build.cjs)
      - name: Three real Chrome repetitions per arm
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          google-chrome --version
          HOST=127.0.0.1 PORT=8793 node "$RUNNER_TEMP/baseline/server.cjs" > baseline-server.log 2>&1 &
          BASE_PID=$!
          HOST=127.0.0.1 PORT=8794 node server.cjs > candidate-server.log 2>&1 &
          CAND_PID=$!
          trap 'kill "$BASE_PID" "$CAND_PID" || true' EXIT
          sleep 2
          node verification/idle-retention/run.cjs | tee idle-retention.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-retention-evidence
          path: |
            idle-retention-evidence/
            idle-retention.log
            baseline-server.log
            candidate-server.log
