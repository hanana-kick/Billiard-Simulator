name: Foreground wave yield Chrome comparison (no deployment)
on:
  push:
    branches: ['backup/foreground-wave-yield-20261105']
permissions:
  contents: read
jobs:
  repeated:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source identity and Chrome security
        run: |
          test "$(id -u)" != 0
          google-chrome --version | tee chrome-environment.log
          node --version | tee -a chrome-environment.log
          git rev-parse HEAD | tee -a chrome-environment.log
          sha256sum src/optimizer-service.js verification/chrome/baseline-optimizer-service.js | tee -a chrome-environment.log
          echo '6b197a5a4118fc9b1ff25284b73bfa32cf2665a7be6f1461a0d053d555e975e5  src/optimizer-service.js' | sha256sum -c -
          echo 'e0258591997e15531f7dfe310fa81557904cc9f9f2589abc082b0321d8850ae2  verification/chrome/baseline-optimizer-service.js' | sha256sum -c -
      - name: Focused foreground scheduling contracts
        run: node --test verification/chrome/foreground-yield.test.cjs
      - name: Build both frozen-source arms
        id: builds
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/baseline"
          mkdir "$BASE"
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.compiled-build -cf - . | tar -xf - -C "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          cp verification/chrome/baseline-optimizer-service.js "$BASE/src/optimizer-service.js"
          npm run prepare:engine
          node build.cjs --canonical-controller-assets
          node verification/chrome/stamp-build.cjs "$GITHUB_WORKSPACE"
          (cd "$BASE" && npm run prepare:engine && node build.cjs --canonical-controller-assets)
          node verification/chrome/stamp-build.cjs "$BASE"
      - name: Repeated foreground yield comparison, all 40 attempts
        if: steps.builds.outcome == 'success'
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=8793 node "$RUNNER_TEMP/baseline/server.cjs" > baseline-server.log 2>&1 &
          BASE_PID=$!
          HOST=127.0.0.1 PORT=8794 node server.cjs > candidate-server.log 2>&1 &
          CAND_PID=$!
          trap 'kill "$BASE_PID" "$CAND_PID" || true' EXIT
          for p in 8793 8794; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$p/" -o /dev/null; then break; fi
              sleep 1
            done
          done
          CPU_WINDOW_RELEASED=yes BOUNDED_CANDIDATE_PASSED=yes MODE=pacing EXPERIMENT=foreground-wave-yield EXPECTED_BASELINE_OPTIMIZER_SHA256=e0258591997e15531f7dfe310fa81557904cc9f9f2589abc082b0321d8850ae2 EXPECTED_CANDIDATE_OPTIMIZER_SHA256=6b197a5a4118fc9b1ff25284b73bfa32cf2665a7be6f1461a0d053d555e975e5 APP_ROOT="$GITHUB_WORKSPACE" BASELINE_ROOT="$RUNNER_TEMP/baseline" CANDIDATE_ROOT="$GITHUB_WORKSPACE" BASELINE_URL=http://127.0.0.1:8793/ CANDIDATE_URL=http://127.0.0.1:8794/ OUT_DIR="$GITHUB_WORKSPACE/chrome-pacing-raw" node verification/chrome/browser-comparison.cjs | tee chrome-pacing.log
      - name: Preserve every attempt and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-foreground-yield-all-attempts
          path: |
            chrome-pacing-raw/
            chrome-pacing.log
            chrome-precompute-raw/
            chrome-precompute.log
            precompute-server.log
            chrome-environment.log
            baseline-server.log
            candidate-server.log
            precompute-integration-manifest.json
            verification/chrome/
          retention-days: 30
