name: Production Mac Chrome black-box reproduction (no deployment)
on:
  push:
    branches: ['backup/**']
    paths: ['.github/workflows/production-blackbox.yml', 'playwright.production-blackbox.config.cjs', 'tests/browser-production-blackbox/**']
  workflow_dispatch:
    inputs:
      expected_source_revision:
        description: Explicit independently verified deployed source revision (64 lowercase hex)
        required: true
        default: 75c09c39e6d97085f4c4bf8045f0f892f121130d00340128101602de7df0e2df
        type: string
permissions:
  contents: read
jobs:
  production:
    if: startsWith(github.ref, 'refs/heads/backup/')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test unchanged public production UI with standard headed Chrome
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.expected_source_revision || '75c09c39e6d97085f4c4bf8045f0f892f121130d00340128101602de7df0e2df' }}
        run: npx playwright test -c playwright.production-blackbox.config.cjs
      - name: Preserve compact production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-mac-blackbox-compact
          path: |
            test-results-production-blackbox/**/production-evidence.json
            test-results-production-blackbox/**/final.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve reproduction evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-mac-blackbox
          path: |
            test-results-production-blackbox/
            playwright-production-blackbox-report/
          if-no-files-found: warn
          retention-days: 14
