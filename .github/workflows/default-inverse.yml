name: Default inverse CPU baseline (no deployment)
on:
  push:
    branches: ['backup/default-inverse-cpu-20261106']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:engine
      - run: node --check verification/default-inverse/run.cjs
      - run: node build.cjs --canonical-controller-assets
      - name: 12 actual default UI searches
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          google-chrome --version | tee chrome-environment.log
          git rev-parse HEAD | tee -a chrome-environment.log
          HOST=127.0.0.1 PORT=8794 node server.cjs > server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8794/ -o /dev/null; then break; fi
            sleep 1
          done
          node verification/default-inverse/run.cjs | tee default-inverse.log
      - name: Preserve all attempts and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-inverse-all-evidence
          path: |
            default-inverse-raw/
            default-inverse.log
            chrome-environment.log
            server.log
            verification/default-inverse/
          retention-days: 30
