name: Apply verified UI integration corrections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-level integration corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          function change(file,oldText,newText){let s=fs.readFileSync(file,'utf8');if(s.includes(newText))return;if(!s.includes(oldText))throw Error('Unexpected source: '+file);fs.writeFileSync(file,s.replace(oldText,newText));}
          change('src/App.tsx','<TabsList id="panelGroup"','<TabsList activateOnFocus id="panelGroup"');
          change('src/styles.css','@theme inline {','/* Base UI emits data-orientation, not bare data-horizontal/data-vertical. */\n@custom-variant data-horizontal (&[data-orientation="horizontal"]);\n@custom-variant data-vertical (&[data-orientation="vertical"]);\n@theme inline {');
          change('src/components/controls.tsx','return <Slider id={id} value={[value]} min={min} max={max} step={step}', 'const labelId = React.useId()\n  return <><span id={labelId} className="sr-only">{label}</span><Slider id={id} value={[value]} min={min} max={max} step={step} thumbAlignment="center" aria-labelledby={labelId}');
          change('src/components/controls.tsx','aria-label={label} disabled={disabled} />','aria-label={label} disabled={disabled} /></>');
          const expected={'src/App.tsx':'0633a9b6a4e66859340643fc4c76922a135737a704a8fc1a174107fcb3b1baf9','src/styles.css':'8efd76cf4a742b9866058e38633a9288a48df52eb87965f4c8bf9903e0560593','src/components/controls.tsx':'c0f266df4d8afa87df8113bb0a7ccbbaa7f027ecd4675b1aecc81a5276bd9733'};
          for(const [f,hash] of Object.entries(expected)){if(crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex')!==hash)throw Error('Tested source mismatch: '+f);}
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.scripts['build:online'];delete p.scripts['test:core-browser'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          console.log('Source matches the locally rendered and tested corrections.');
          NODE
      - name: Commit corrected application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/styles.css src/components/controls.tsx package.json
          if ! git diff --staged --quiet; then
            git commit -m 'fix: render actual Base UI sliders and preserve keyboard tab navigation'
            git push origin HEAD:main
          fi
