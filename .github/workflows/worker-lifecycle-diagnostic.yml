name: Worker lifecycle diagnostic (no deployment)
on:
  push:
    branches: ['backup/**']
    paths:
      - '.github/workflows/worker-lifecycle-diagnostic.yml'
      - 'tests/browser-worker-lifecycle/**'
      - 'playwright.worker-lifecycle.config.cjs'
      - 'tools/probe-browser-worker-webgpu.cjs'
      - 'tools/*selected*diagnostic*.mjs'
      - 'tests/fixtures/selected-*diagnostic*.mjs'
  workflow_dispatch:
    inputs:
      frozen_observer:
        description: 'Run frozen 90ad observer (rejects other source revisions)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  worker-lifecycle:
    if: startsWith(github.ref, 'refs/heads/backup/')
    runs-on: macos-15
    timeout-minutes: 55
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record environment
        run: |
          test "$(id -u)" != 0
          node -e "const fs=require('node:fs'),os=require('node:os');fs.mkdirSync('worker-lifecycle-evidence',{recursive:true});fs.writeFileSync('worker-lifecycle-evidence/environment.json',JSON.stringify({platform:os.platform(),release:os.release(),arch:os.arch(),cpus:os.cpus().length,node:process.version,commit:process.env.GITHUB_SHA},null,2));"
          git status --porcelain > worker-lifecycle-evidence/checkout-status.txt
      - name: Require real Worker WebGPU capability before expensive build
        run: node tools/probe-browser-worker-webgpu.cjs
      - run: npm run prepare:engine
      - run: npm run typecheck
      - name: Build current sealed application
        run: |
          # Keep strict no-symlink source/output checks intact on macOS /var aliases.
          export TMPDIR="$(node -e "process.stdout.write(require('node:fs').realpathSync(require('node:os').tmpdir()))")"
          node build.cjs --canonical-controller-assets
      - name: Build test-only selected observer bundles
        if: github.event_name == 'workflow_dispatch' && inputs.frozen_observer
        id: diagnostic-build
        run: node tools/build-selected-native-diagnostic.mjs
      - name: Search, strike, mixed-width re-search, cancel and restart
        run: npx playwright test -c playwright.worker-lifecycle.config.cjs lifecycle.spec.cjs
      - name: Replay exact captured inputs before interpreting bounded native snapshots
        if: always() && steps.diagnostic-build.outcome == 'success'
        run: npx playwright test -c playwright.worker-lifecycle.config.cjs selected-snapshots.spec.cjs --output=test-results-selected-snapshots --reporter=list
      - name: Read available host memory evidence
        if: always()
        shell: bash
        run: |
          for file in /proc/meminfo /proc/self/cgroup /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
            { echo "### $file"; if test -r "$file"; then cat "$file"; else echo unavailable; fi; } >> worker-lifecycle-evidence/host-memory-after.txt
          done
      - name: Preserve compact selected input and full-output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-selected-raw
          path: |
            worker-lifecycle-evidence/selected-inputs/
            worker-lifecycle-evidence/selected-output/
            worker-lifecycle-evidence/capability.json
            test-results-worker-lifecycle/**/lifecycle.json
            test-results-worker-lifecycle/**/events.jsonl
            dist/canonical-controller-assets/manifest.json
          retention-days: 14
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-lifecycle-diagnostic
          path: |
            worker-lifecycle-evidence/
            test-results-worker-lifecycle/
            test-results-selected-snapshots/
            dist/__selected-diagnostic/
            playwright-worker-lifecycle-report/
            docs/ui-bundle-audit.json
            dist/canonical-controller-assets/
          retention-days: 14
      - name: Qualification boundary
        if: always()
        run: |
          echo 'Diagnostic only. Capability failure is not an application crash. A lifecycle pass is not full numerical parity, full UI qualification, physical GPU validation or deployment. Inspect lifecycle.json and capability.json.' >> "$GITHUB_STEP_SUMMARY"
