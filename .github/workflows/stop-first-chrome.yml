name: Repeated default-route UI diagnostics (no deployment)
on:
  push:
    branches: ['validation/stop-first-resume-check-20261106']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        fixture: [default3]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build frozen baseline and isolated stop policy
        run: |
          set -euo pipefail
          node --test tests/worker-pool.cjs
          for arm in fixed65536 quantum8192; do
            mkdir -p "$RUNNER_TEMP/$arm"
            tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C "$RUNNER_TEMP/$arm"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/$arm/node_modules"
          done
          cp verification/default-quantum/baseline-planner.js "$RUNNER_TEMP/fixed65536/src/inverse-planner.js"
          cp verification/default-quantum/candidate-planner.js "$RUNNER_TEMP/quantum8192/src/inverse-planner.js"
          sha256sum "$RUNNER_TEMP/fixed65536/src/optimizer-service.js" "$RUNNER_TEMP/fixed65536/src/inverse-planner.js" "$RUNNER_TEMP/quantum8192/src/inverse-planner.js" | tee source-hashes.log
          for arm in fixed65536 quantum8192; do
            (cd "$RUNNER_TEMP/$arm" && npm run prepare:engine && npm run build)
          done
      - name: Actual desktop and narrow UI smoke
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version | tee chrome-version.log
          lscpu > host-cpu.log
          HOST=127.0.0.1 PORT=8793 node "$RUNNER_TEMP/fixed65536/server.cjs" > ui-old-server.log 2>&1 &
          A=$!
          HOST=127.0.0.1 PORT=8794 node "$RUNNER_TEMP/quantum8192/server.cjs" > ui-new-server.log 2>&1 &
          B=$!
          trap 'kill "$A" "$B" || true' EXIT
          sleep 2
          node verification/default-quantum/ui.cjs | tee ui.log
          node -e "if(!require('./ui-results/summary.json').ok)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-ui-${{ matrix.fixture }}
          path: |
            default-quantum-results/
            ui-results/
            ui.log
            comparison.log
            chrome-version.log
            host-cpu.log
            old-server.log
            fixed-server.log
            source-hashes.log
