name: Production candidate full gates (no deployment)
on:
  push:
    branches: ['validation/stop-first-resume-check-20261106']
    paths: ['.github/workflows/stop-first-chrome.yml', 'tests/inverse-planner.cjs', 'tests/cpu-event-window-integration.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:engine
      - run: npm run typecheck
      - run: node build.cjs --canonical-controller-assets
      - name: Full physics search and feature regressions
        run: npm test
      - run: npm run test:resident:host
      - run: npm run test:provenance
      - run: google-chrome --version
      - name: Full real application desktop and mobile
        run: CANONICAL_ASSETS_REQUIRED=1 npm run test:e2e
      - name: Preserve all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-preflight
          path: |
            playwright-report/
            test-results/
            docs/ui-bundle-audit.json
          retention-days: 14
