name: Live production corrected Chrome qualification
on:
  push:
    branches: ['validation/stop-first-resume-check-20261106']
    paths: ['.github/workflows/stop-first-chrome.yml', 'verification/live-production/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fixture: [default3, default4, moved3, moved4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: google-chrome --version
      - name: Record runner metadata
        run: node -e 'const o=require("node:os"); console.log(JSON.stringify({node:process.version,platform:o.platform(),release:o.release(),cpus:o.cpus().map(c=>({model:c.model,speed:c.speed})),memory:o.totalmem()},null,2))' > runner.json
      - name: Read-only live Chrome qualification, four fixed cases
        env:
          FIXTURE: ${{ matrix.fixture }}
          REQUIRE_EXPECTED_ASSETS: '1'
          OUT_DIR: live-production-results
        run: |
          set -o pipefail
          node verification/live-production/live-chrome-corrected.cjs 2>&1 | tee live-production.log
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-${{ matrix.fixture }}
          path: |
            live-production-results/
            live-production.log
            runner.json
            verification/live-production/expected-assets.json
          retention-days: 14
