name: Promotion stop paired Chrome qualification
on:
  push:
    branches: ['validation/stop-first-resume-check-20261106']
    paths: ['.github/workflows/stop-first-chrome.yml', 'verification/promotion-stop/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        fixture: [default3, default4, moved3, moved4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build separately pinned source arms
        run: |
          set -euo pipefail
          mkdir -p /tmp/promotion-baseline /tmp/promotion-candidate
          for arm in baseline candidate; do
            tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C /tmp/promotion-$arm
            ln -s "$PWD/node_modules" /tmp/promotion-$arm/node_modules
          done
          cp verification/promotion-stop/baseline-optimizer-service.js /tmp/promotion-baseline/src/optimizer-service.js
          cp verification/promotion-stop/candidate-optimizer-service.js /tmp/promotion-candidate/src/optimizer-service.js
          node verification/promotion-stop/check-inputs.cjs /tmp/promotion-baseline /tmp/promotion-candidate
          (cd /tmp/promotion-baseline && npm run prepare:engine && node build.cjs --canonical-controller-assets)
          (cd /tmp/promotion-candidate && npm run prepare:engine && node build.cjs --canonical-controller-assets)
          (cd /tmp/promotion-baseline && PORT=8793 node server.cjs > "$GITHUB_WORKSPACE/baseline-server.log" 2>&1 &)
          (cd /tmp/promotion-candidate && PORT=8794 node server.cjs > "$GITHUB_WORKSPACE/candidate-server.log" 2>&1 &)
      - name: Record host
        run: |
          google-chrome --version
          node -e 'const o=require("node:os"); console.log(JSON.stringify({cpus:o.cpus(),memory:o.totalmem(),release:o.release(),node:process.version},null,2))' > runner.json
      - name: Eight fixed paired cases
        env:
          FIXTURE: ${{ matrix.fixture }}
          OUT_DIR: promotion-stop-results
        run: |
          set -o pipefail
          node verification/promotion-stop/chrome.cjs 2>&1 | tee promotion-stop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-stop-${{ matrix.fixture }}
          path: |
            promotion-stop-results/
            promotion-stop.log
            runner.json
            *-server.log
          retention-days: 14
