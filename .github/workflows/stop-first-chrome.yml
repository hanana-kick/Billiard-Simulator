name: Strict complete-wave retention checks (no deployment)
on:
  push:
    branches: ['validation/stop-first-resume-check-20261106']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fixture: [default3]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build frozen baseline and isolated stop policy
        run: |
          set -euo pipefail
          node --test tests/worker-pool.cjs
          for arm in baseline candidate fair-first; do
            mkdir -p "$RUNNER_TEMP/$arm"
            tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C "$RUNNER_TEMP/$arm"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/$arm/node_modules"
          done
          cp verification/stop-first/baseline-optimizer-service.js "$RUNNER_TEMP/baseline/src/optimizer-service.js"
          cp verification/stop-first/fair-first-planner.js "$RUNNER_TEMP/fair-first/src/inverse-planner.js"
          for arm in baseline candidate fair-first; do
            (cd "$RUNNER_TEMP/$arm" && npm run prepare:engine && npm run build)
          done
      - name: Repeated sandboxed Chrome comparison and full-rest replays
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          google-chrome --version | tee chrome-version.log
          lscpu > host-cpu.log
          HOST=127.0.0.1 PORT=8793 node "$RUNNER_TEMP/baseline/server.cjs" > baseline-server.log 2>&1 &
          BASE_PID=$!
          HOST=127.0.0.1 PORT=8794 node "$RUNNER_TEMP/candidate/server.cjs" > candidate-server.log 2>&1 &
          CAND_PID=$!
          HOST=127.0.0.1 PORT=8795 node "$RUNNER_TEMP/fair-first/server.cjs" > fair-first-server.log 2>&1 &
          FAIR_PID=$!
          trap 'kill "$BASE_PID" "$CAND_PID" "$FAIR_PID" || true' EXIT
          sleep 2
          node verification/stop-first/full-wave.cjs | tee comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-wave-${{ matrix.fixture }}
          path: |
            full-wave-results/
            comparison.log
            chrome-version.log
            host-cpu.log
            baseline-server.log
            candidate-server.log
            fair-first-server.log
