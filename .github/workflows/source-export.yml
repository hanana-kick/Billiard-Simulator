name: Export review source
on:
  push:
    paths: ['.github/workflows/source-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git archive --format=tar.gz HEAD > /tmp/billiard-source.tgz
          npx --yes shadcn@latest docs slider select field tabs > /tmp/shadcn-docs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: |
            /tmp/billiard-source.tgz
            /tmp/shadcn-docs.txt
          retention-days: 2
