<!doctype html><meta charset=utf-8><title>Billiard frame cap actual-browser check</title><style>body{font:16px sans-serif;background:#eee}button{padding:10px}iframe{width:600px;height:470px;border:0}pre{white-space:pre-wrap}</style><h1>Actual application render counter</h1><button id=run onclick="measure()">Measure actual frames for 10 seconds</button><button onclick="hiddenMeasure()">Record hidden/return interval</button><pre id=out>Waiting for actual application</pre><iframe id=app src="../../dist/"></iframe><script>
const get=()=>app.contentWindow.cueLab;let forcing=false;function dirty(){if(!forcing)return;get().dirty=true;requestAnimationFrame(dirty)}
async function measure(){const c=get();if(!c?.state.ready)return;run.disabled=true;c.option('predict',false);const start=performance.now(),count=c.renderedFrames();forcing=true;dirty();out.textContent='Measuring actual '+(c.renderer.isFallback?'CPU fallback':c.renderer.workerMode?'WebGL worker':'WebGL main')+' rendering…';await new Promise(r=>setTimeout(r,10000));forcing=false;const duration=performance.now()-start,frames=c.renderedFrames()-count;out.textContent=JSON.stringify({mode:c.renderer.isFallback?'CPU fallback':c.renderer.workerMode?'WebGL worker':'WebGL main',cap:c.renderMetrics.cap,durationMs:duration,actualCompletedFrames:frames,averageFps:frames/(duration/1000),limit:Math.ceil(duration*c.renderMetrics.cap/1000)+1,passed:frames<=Math.ceil(duration*c.renderMetrics.cap/1000)+1},null,2);run.disabled=false;}
function hiddenMeasure(){const c=get();forcing=true;dirty();out.textContent='Switch to another tab, then return. Hidden frames will be counted.';let startCount=0,start=0;const fn=()=>{if(document.hidden){startCount=c.renderedFrames();start=performance.now();}else if(start){forcing=false;out.textContent=JSON.stringify({hiddenMs:performance.now()-start,hiddenRenderedFrames:c.renderedFrames()-startCount},null,2);document.removeEventListener('visibilitychange',fn);}};document.addEventListener('visibilitychange',fn);}
app.onload=()=>out.textContent='Actual application loaded. Click measure.';
</script>
