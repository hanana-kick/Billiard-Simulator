<!doctype html><meta charset="utf-8"><title>Responsive/input diagnostic harness</title>
<style>body{margin:12px;font:14px system-ui;background:#eee;color:#111}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}button{padding:8px}iframe{display:block;width:390px;height:620px;border:1px solid #777}pre{white-space:pre-wrap;max-width:1000px;max-height:180px;overflow:auto}</style>
<h1>Cloud diagnostic harness</h1>
<p>Actual app in an iframe. CSS viewport checks and canvas timing are not real Samsung hardware, touch-to-photon latency, or the full Playwright suite.</p>
<nav><button onclick="resize(390,620)">Phone 390 × 620</button><button onclick="resize(344,882)">Fold outer 344 × 882</button><button onclick="resize(768,960)">Fold inner 768 × 960</button><button onclick="resize(844,390)">Landscape 844 × 390</button><button onclick="resize(1100,620)">Wide 1100 × 620</button><button onclick="save()">Capture baseline</button><button onclick="inspect()">Inspect state and metrics</button><button id="measure" onclick="measureFrames()">Measure frames for 10 seconds</button></nav>
<pre id="out">Waiting for app.</pre><iframe id="app" src="../../dist/"></iframe>
<script>
const get=()=>app.contentWindow.cueLab;let baseline,forcing=false;
function describe(c){return{settings:{...c.state.settings},positions:c.lab.objects.map(o=>({...o.body.translation()})),shots:c.lab.shots,time:c.lab.time,undo:c.undoStack.length,redo:c.redoStack.length,activePanel:c.state.activePanel,camera:structuredClone(c.renderer.camera)}}
function save(){const c=get();if(!c?.state.ready)return;baseline={lab:c.lab,canvas:c.canvas,state:describe(c)};inspect()}
function resize(w,h){app.style.width=w+'px';app.style.height=h+'px';requestAnimationFrame(()=>requestAnimationFrame(inspect))}
function inspect(){const c=get();if(!c?.state.ready){out.textContent='App starting';return}const d=app.contentDocument,r=c.canvas.getBoundingClientRect();out.textContent=JSON.stringify({environment:'Cloud browser; CSS iframe viewport only',viewport:[app.clientWidth,app.clientHeight],renderer:c.snapshot().renderMode,fontLoaded:d.fonts.check('14px "Pretendard Variable"','당구 연습'),canvas:{width:r.width,height:r.height},overflow:d.documentElement.scrollWidth>app.clientWidth+1,removedOverlays:d.querySelectorAll('#fullscreen,#aimHandle,#gripHandle,.pull-meter').length,sameWorld:!baseline||c.lab===baseline.lab,sameCanvas:!baseline||c.canvas===baseline.canvas,sameCommittedState:!baseline||JSON.stringify(describe(c))===JSON.stringify(baseline.state),state:describe(c),activeGesture:c.drag?.type||null,input:c.inputMetrics,render:c.renderMetrics,measurement:'Input Event.timeStamp to matching canvas rendering call; main-thread WebGL excludes GPU completion; all modes exclude compositor and physical display'},null,2)}
function dirty(){if(!forcing)return;get().dirty=true;requestAnimationFrame(dirty)}
async function measureFrames(){const c=get();if(!c?.state.ready)return;measure.disabled=true;c.option('predict',false);const start=performance.now(),frames=c.renderedFrames();forcing=true;dirty();out.textContent='Measuring actual canvas frame completion…';await new Promise(r=>setTimeout(r,10000));forcing=false;const duration=performance.now()-start,count=c.renderedFrames()-frames,limit=Math.ceil(duration*c.renderMetrics.cap/1000)+1;out.textContent=JSON.stringify({environment:'Cloud browser actual canvas rendering, not Samsung device',mode:c.snapshot().renderMode,cap:c.renderMetrics.cap,durationMs:duration,completedFrames:count,averageFps:count/(duration/1000),limit,passed:count<=limit,input:c.inputMetrics},null,2);measure.disabled=false}
app.onload=inspect;
</script>
