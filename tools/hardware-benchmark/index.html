<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로컬 정규 물리 벤치마크 · 0850a4d</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:1rem;background:#101923;color:#e8edf4}button,select{font:inherit;padding:.6rem;margin:.4rem}label{display:block;margin:.7rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bbc9da}</style>
<h1>로컬 정규 물리 벤치마크</h1><p>고정 파이프라인 <code>0850a4d</code> · N1 / N3 / N32. 외부 전송 없음. 실제 GPU 여부는 단정하지 않습니다. 수 분이 걸릴 수 있습니다.</p>
<p>동일한 제한 범위 후보를 비교합니다. 전체 게임 성능이나 범용 하드웨어 보정 계수가 아닙니다. 다른 GPU 작업을 중단하고 이 탭을 표시한 상태로 두세요.</p>
<label>측정 반복 횟수 <select id="repeats"><option>3</option><option>5</option><option>7</option></select></label>
<label><input type="checkbox" id="fallback"> 폴백 어댑터 요청 (지원하지 않으면 실패하며 임의로 대체하지 않음)</label>
<label><input type="checkbox" id="large"> N256도 측정 (상한 적용, 오래 걸릴 수 있음)</label>
<button id="run">측정 시작</button><button id="stop" disabled>중지</button><button id="save" disabled>JSON 내보내기</button>
<p id="status" role="status">준비됨. 브라우저가 어댑터 정보를 제공하지 않으면 실제 GPU 여부 확인 불가로 기록합니다.</p><pre id="result"></pre>
<script type="module">
const $=id=>document.getElementById(id);let worker,report;
$('run').onclick=()=>{report=null;$('save').disabled=true;$('run').disabled=true;$('stop').disabled=false;$('result').textContent='';worker=new Worker('./worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress')$('status').textContent=data.text;else{report=data.report;$('status').textContent=`${report.status==='complete'?'측정 완료':'측정 실패'}. 실제 GPU 여부 확인 불가.`;$('result').textContent=JSON.stringify({adapter:report.adapter,compilation:report.compilation,ratios:report.ratios,error:report.error},null,2);$('save').disabled=false;$('run').disabled=false;$('stop').disabled=true;worker.terminate();}};worker.onerror=event=>{$('status').textContent=`작업자 오류: ${event.message}`;$('run').disabled=false;$('stop').disabled=true;worker.terminate();};worker.postMessage({repeats:Number($('repeats').value),include256:$('large').checked,forceFallback:$('fallback').checked});};
$('stop').onclick=()=>{worker?.terminate();$('status').textContent='중지됨. 이미 제출된 GPU 작업은 비동기로 끝날 수 있습니다. 측정 완료로 처리하지 않습니다.';$('run').disabled=false;$('stop').disabled=true;};
$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='billiard-local-benchmark-0850a4d.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
