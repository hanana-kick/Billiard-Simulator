[package]
name = "rapier-snapshot-browser-decoder"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

# build-candidate.cjs / build-wasm.cjs supply a verified official-source path override. A plain
# registry build is not accepted as provenance by the JavaScript wrapper.
[dependencies]
rapier3d = { version = "=0.36.0", features = ["serde-serialize", "enhanced-determinism", "debug-render", "profiler", "fem"] }
parry3d = "=0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
bincode = "=1.3.3"
sha2 = "0.10"

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
debug = 0
panic = "abort"
