<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>Resident physics calibration</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>GPU 보정 측정 · 검증용</h1><p>같은 원본 물리·입력·셰이더로 측정합니다. 현재 승인된 기준은 후보 6개, 물리 2 h입니다. 전체 타격 완료나 1,024개 처리 성능을 뜻하지 않습니다.</p><p><strong>기기 소유자의 실행 허가를 받은 환경에서만 실행하세요.</strong> 자동 실행·업로드·외부 통신은 하지 않습니다.</p>
<section aria-label="측정 설정"><label>예상 어댑터 <select id="adapterClass"><option value="hardware">실제 하드웨어 GPU</option><option value="software">소프트웨어 GPU</option></select></label><label>기기 이름 (기록용) <input id="machineLabel" placeholder="예: RTX 3080 Ti"></label><label>타임스탬프 <select id="timestampMode"><option value="off">사용 안 함 · 큐 대기 시간 별도 표기</option><option value="required">GPU timestamp-query 필수</option></select></label><label>반복 횟수 <input id="repeats" type="number" min="3" max="9" value="3"></label><button id="load">입력 검증·불러오기 (GPU 실행 안 함)</button><button id="run" disabled>이 브라우저에서 측정</button><button id="download" disabled>측정 보고서 저장</button></section>
<pre id="status" role="status">대기 중. 하드웨어/소프트웨어 보정 배율은 아직 측정되지 않았습니다.</pre>
<section><h2>저장한 동일 작업 보고서 비교</h2><label>소프트웨어 보고서 <input id="softwareReport" type="file" accept="application/json"></label><label>하드웨어 보고서 <input id="hardwareReport" type="file" accept="application/json"></label><button id="compare">배율 계산</button><pre id="comparison"></pre></section>
<details><summary>후보 수 확장 계획 · 미측정</summary><pre id="matrix"></pre></details></main><script type="module" src="app.mjs"></script></body></html>
